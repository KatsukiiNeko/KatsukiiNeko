# Put this file at: .github/workflows/snake.yml
# in your profile repo (KatsukiiNeko/KatsukiiNeko), then run it once from the Actions tab.
name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: build the snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6e30e3&color_dots=#ebedf0,#d8c6ff,#b794ff,#9b5cff,#6e30e3
            dist/github-snake-dark.svg?color_snake=#f0e6ff&color_dots=#161b22,#3b2a66,#6e30e3,#9b5cff,#c9a7ff

      - name: push them to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
